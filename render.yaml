services:
  - type: web
    name: menuscan-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menuscan-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: menuscan-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: menuscan-parser
    env: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menuscan-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: menuscan-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production

  - type: redis
    name: menuscan-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: menuscan-pg
    plan: starter
    databaseName: menuscan
    user: menuscan
